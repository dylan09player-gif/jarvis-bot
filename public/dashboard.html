<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jarvis Mobile Assistant - dr. Dylan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0e1621;
      --bg-panel: #17212b;
      --bg-header: #242f3d;
      --border: #101921;
      --text: #f5f5f5;
      --text-muted: #7f91a4;
      --accent: #5288c1;
      --bubble-out: #2b5278;
      --bubble-in: #182533;
      --bubble-ai: #1c3144;
      --badge-green: #40b77b;
      --badge-yellow: #e6a23c;
      --badge-red: #e53935;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text);
      overflow: hidden;
      position: fixed;
    }

    /* CONTAINER APP */
    .app-root {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
    }

    /* VIEW 1: CONTACT LIST (TAMPILAN UTAMA HP) */
    .view-list {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .header-bar {
      background-color: var(--bg-header);
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      padding: 8px 12px;
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 18px;
      background-color: var(--bg-panel);
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .contacts-container {
      flex: 1;
      overflow-y: auto;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
    }

    .contact-item:active {
      background-color: rgba(43, 82, 120, 0.4);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5288c1, #3b6693);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }

    .meta-box {
      flex: 1;
      min-width: 0;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .name-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .preview-text {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
      margin-top: 4px;
    }

    .pill-green { background: rgba(64, 183, 123, 0.2); color: var(--badge-green); }
    .pill-yellow { background: rgba(230, 162, 60, 0.2); color: var(--badge-yellow); }
    .pill-red { background: rgba(229, 57, 53, 0.2); color: var(--badge-red); }

    /* VIEW 2: CHAT DETAIL (TAMPILAN DETAIL PERCAKAPAN HP) */
    .view-chat {
      width: 100%;
      height: 100%;
      background-color: var(--bg-panel);
      display: none;
      flex-direction: column;
      z-index: 2;
      position: absolute;
      top: 0;
      left: 0;
    }

    .chat-header {
      background-color: var(--bg-header);
      height: 56px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .header-user-info {
      min-width: 0;
    }

    .header-user-info h3 {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-user-info p {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action-small {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-yellow { background-color: var(--badge-yellow); color: #000; }
    .btn-green { background-color: var(--badge-green); color: #fff; }

    .messages-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-wrapper {
      display: flex;
      width: 100%;
    }

    .wrap-in { justify-content: flex-start; }
    .wrap-out { justify-content: flex-end; }

    .bubble {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
    }

    .bubble-in { background-color: var(--bubble-in); border-top-left-radius: 2px; }
    .bubble-ai { background-color: var(--bubble-ai); border: 1px solid rgba(82, 136, 193, 0.3); border-top-left-radius: 2px; }
    .bubble-out { background-color: var(--bubble-out); border-top-right-radius: 2px; }

    .sender-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .bubble-time {
      font-size: 10px;
      color: var(--text-muted);
      float: right;
      margin-left: 10px;
      margin-top: 4px;
    }

    .input-bar {
      background-color: var(--bg-header);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-bar textarea {
      flex: 1;
      height: 38px;
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 19px;
      color: var(--text);
      padding: 8px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
    }

    .btn-send-round {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--accent);
      border: none;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* MODAL SAVE CONTACT */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-box {
      background-color: var(--bg-header);
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-box h4 { font-size: 16px; font-weight: 500; }
    .modal-box input, .modal-box select {
      width: 100%; padding: 10px; border-radius: 8px;
      background: var(--bg-main); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; outline: none;
    }

    .modal-btns {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;
    }

    .btn-cancel { background: none; border: none; color: var(--text-muted); padding: 8px; cursor: pointer; }
    .btn-submit { background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 12px; cursor: pointer; }

    /* DESKTOP RESPONSIVE ADJUSTMENT (> 768px) */
    @media (min-width: 769px) {
      .view-list { width: 360px; border-right: 1px solid var(--border); }
      .view-chat { display: flex !important; flex: 1; position: relative; }
      .btn-back { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-root">
    <!-- VIEW 1: CONTACT LIST (Halaman Utama HP) -->
    <div class="view-list" id="viewList">
      <div class="header-bar">
        <div class="brand-title">✈️ Jarvis Assistant</div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari nama / nomor WA..." onkeyup="filterContacts()">
      </div>
      <div class="contacts-container" id="contactList">
        <div style="text-align:center; padding:40px 20px; color:var(--text-muted);">Memuat percakapan...</div>
      </div>
    </div>

    <!-- VIEW 2: CHAT DETAIL (Halaman Obrolan HP) -->
    <div class="view-chat" id="viewChat">
      <div class="chat-header">
        <div class="header-left-btn">
          <button class="btn-back" onclick="showContactList()">←</button>
          <div class="header-user-info">
            <h3 id="targetName">Nama Kontak</h3>
            <p id="targetCategory">08123456789</p>
          </div>
        </div>
        <div class="header-right-actions">
          <button class="btn-action-small btn-yellow" id="btnTogglePause" onclick="toggleAIPause()">⏸️ Jeda 24h</button>
          <button class="btn-action-small" onclick="openSaveModal()">👤 Simpan</button>
        </div>
      </div>

      <div class="messages-body" id="chatMessages">
        <div style="text-align:center; padding:40px 20px; color:var(--text-muted);">Pilih pesan untuk mulai chat</div>
      </div>

      <div class="input-bar" id="inputBar">
        <textarea id="replyText" placeholder="Ketik balasan WA... (AI Jeda 24 Jam)"></textarea>
        <button class="btn-send-round" onclick="sendDoctorReply()">➤</button>
      </div>
    </div>
  </div>

  <!-- MODAL SAVE CONTACT -->
  <div class="modal-overlay" id="saveModal">
    <div class="modal-box">
      <h4>👤 Simpan Kontak Baru</h4>
      <div>
        <label style="font-size:11px; color:var(--accent);">Nomor WA</label>
        <input type="text" id="modalNumber" readonly>
      </div>
      <div>
        <label style="font-size:11px; color:var(--accent);">Nama Kontak</label>
        <input type="text" id="modalName" placeholder="Contoh: Pak Budi, Bidan Sri, Mamah...">
      </div>
      <div>
        <label style="font-size:11px; color:var(--accent);">Kategori / Status</label>
        <select id="modalCategory">
          <option value="Pasien LBP">Pasien LBP</option>
          <option value="Pasien Umum">Pasien Umum</option>
          <option value="Dosen Tesis">Dosen Tesis</option>
          <option value="Perawat / Petugas">Perawat / Petugas</option>
          <option value="Keluarga / VIP (AI Off 100%)">Keluarga / VIP (AI Off 100%)</option>
          <option value="Teman / Rekan">Teman / Rekan</option>
          <option value="Kontak Terdaftar">Lainnya / Umum</option>
        </select>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeSaveModal()">Batal</button>
        <button class="btn-submit" onclick="submitSaveContact()">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    let activeNumber = null;
    let dashboardData = { contacts: [], threads: {} };

    async function fetchDashboardData() {
      try {
        let res = await fetch('/api/dashboard-data');
        let data = await res.json();
        dashboardData = data;
        renderContactList();

        if (activeNumber && dashboardData.threads[activeNumber]) {
          renderChatMessages(activeNumber);
        }
      } catch (err) {
        console.error("Fetch dashboard error:", err);
      }
    }

    function renderContactList() {
      let container = document.getElementById('contactList');
      let filter = document.getElementById('searchInput').value.toLowerCase();
      
      if (!dashboardData.contacts || dashboardData.contacts.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-muted);">Belum ada percakapan aktif hari ini</div>`;
        return;
      }

      let html = "";
      dashboardData.contacts.forEach(c => {
        if (c.name.toLowerCase().includes(filter) || c.number.includes(filter)) {
          let pillClass = c.isPaused ? 'pill-yellow' : (c.isKnown ? 'pill-green' : 'pill-red');
          let pillText = c.isPaused ? '⏸️ Jeda 24h' : (c.isKnown ? '🟢 AI Aktif' : '🔴 Nomor Baru');
          let initial = c.name.charAt(0).toUpperCase();

          html += `
            <div class="contact-item" onclick="openChat('${c.number}')">
              <div class="avatar">${initial}</div>
              <div class="meta-box">
                <div class="row-top">
                  <span class="name-text">${c.name}</span>
                  <span class="time-text">${c.lastTime || ''}</span>
                </div>
                <div class="preview-text">${c.lastMsg || 'Pesan baru'}</div>
                <span class="pill-badge ${pillClass}">${pillText}</span>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;
    }

    function openChat(number) {
      activeNumber = number;
      let contact = dashboardData.contacts.find(c => c.number === number);
      if (contact) {
        document.getElementById('targetName').innerText = contact.name;
        document.getElementById('targetCategory').innerText = `${contact.number} • ${contact.category}`;

        let btnPause = document.getElementById('btnTogglePause');
        if (contact.isPaused) {
          btnPause.className = 'btn-action-small btn-green';
          btnPause.innerText = '▶️ Aktifkan AI';
        } else {
          btnPause.className = 'btn-action-small btn-yellow';
          btnPause.innerText = '⏸️ Jeda 24h';
        }
      }

      renderChatMessages(number);

      // Tampilkan View Chat pada HP
      document.getElementById('viewChat').style.display = 'flex';
    }

    function showContactList() {
      // Kembali ke View List pada HP
      if (window.innerWidth <= 768) {
        document.getElementById('viewChat').style.display = 'none';
      }
    }

    function renderChatMessages(number) {
      let container = document.getElementById('chatMessages');
      let thread = dashboardData.threads[number] || [];

      if (thread.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-muted);">Belum ada pesan dalam riwayat</div>`;
        return;
      }

      let html = "";
      thread.forEach(msg => {
        let wrapClass = msg.role === 'doctor' ? 'wrap-out' : 'wrap-in';
        let bubbleClass = msg.role === 'doctor' ? 'bubble-out' : (msg.role === 'assistant' ? 'bubble-ai' : 'bubble-in');
        let senderTag = msg.role === 'user' ? 'Pasien' : (msg.role === 'assistant' ? '🤖 Jarvis AI' : '👨‍⚕️ dr. Dylan');

        html += `
          <div class="msg-wrapper ${wrapClass}">
            <div class="bubble ${bubbleClass}">
              <div class="sender-tag">${senderTag}</div>
              <div>${msg.content}</div>
              <div class="bubble-time">${msg.time || ''}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    }

    async function sendDoctorReply() {
      let textInput = document.getElementById('replyText');
      let message = textInput.value.trim();
      if (!message || !activeNumber) return;

      try {
        let res = await fetch('/api/send-doctor-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: activeNumber, message: message })
        });
        let result = await res.json();
        if (result.status === 'OK') {
          textInput.value = '';
          fetchDashboardData();
        }
      } catch (err) {
        alert("Gagal mengirim pesan");
      }
    }

    async function toggleAIPause() {
      if (!activeNumber) return;
      try {
        let res = await fetch('/api/toggle-ai-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: activeNumber })
        });
        fetchDashboardData();
      } catch (err) {
        alert("Gagal merubah status AI");
      }
    }

    function openSaveModal() {
      if (!activeNumber) return;
      let contact = dashboardData.contacts.find(c => c.number === activeNumber);
      document.getElementById('modalNumber').value = activeNumber;
      document.getElementById('modalName').value = (contact && contact.isKnown) ? contact.name : '';
      document.getElementById('saveModal').style.display = 'flex';
    }

    function closeSaveModal() {
      document.getElementById('saveModal').style.display = 'none';
    }

    async function submitSaveContact() {
      let number = document.getElementById('modalNumber').value;
      let name = document.getElementById('modalName').value.trim();
      let category = document.getElementById('modalCategory').value;

      if (!name) {
        alert("Nama wajib diisi");
        return;
      }

      try {
        let res = await fetch('/api/save-contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: number, name: name, category: category })
        });
        let result = await res.json();
        if (result.status === 'OK') {
          closeSaveModal();
          alert("✅ Kontak " + name + " Berhasil Disimpan ke Google Sheet!");
          fetchDashboardData();
        }
      } catch (err) {
        alert("Gagal menyimpan kontak");
      }
    }

    function filterContacts() {
      renderContactList();
    }

    setInterval(fetchDashboardData, 3000);
    fetchDashboardData();
  </script>
</body>
</html>
